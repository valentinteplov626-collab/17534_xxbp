/* ===== RESET & BASE ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ===== WRAPPERS ===== */
.xh-player-wrapper {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  background-color: #000;
}
.xh-fake-player {
  position: relative;
  width: 100%;
  min-height: 100vh;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #1a1a1a;
}
.logo { display: flex; align-items: center; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.logo svg { margin: 0 5px; }
.header-actions { display: flex; align-items: center; gap: 15px; }
.icon { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===== TITLE & BREADCRUMBS ===== */
.title-section { padding: 12px 15px; }
.main-title { font-size: 15px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
.breadcrumbs { font-size: 12px; color: #aaa; line-height: 1.4; }

/* ===== TAGS ===== */
.tags-scroll { display: flex; gap: 10px; padding: 0 15px 12px; overflow-x: hidden; }
.tag {
  display: flex; align-items: center; gap: 6px;
  background: #2a0a2a; border: 1px solid #4a1a4a;
  border-radius: 20px; padding: 6px 14px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
}

/* ===== NEW VIDEO PLAYER LOGIC ===== */
.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

/* FRAME & BLUR EFFECTS */
.xh-frame {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  filter: blur(15px) brightness(0.55);
  transition: opacity 0.3s ease, filter 0.5s ease;
  will-change: opacity, filter;
}
.xh-frame.loaded {
  opacity: 1;
  filter: blur(3px) brightness(0.7);
}

/* SPINNER LOADER */
.xh-loader {
  position: absolute;
  top: 50%; left: 50%;
  width: 46px; height: 46px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: #fff;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  animation: spin 1s linear infinite;
  z-index: 30;
}
@keyframes spin {
  to { transform: translate(-50%,-50%) rotate(360deg); }
}

/* PULSING PLAY BUTTON */
.central-play {
  position: absolute;
  top: 50%; left: 50%;
  width: 70px; height: 70px;
  background: rgba(255,255,255,.2);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  z-index: 25;
  animation: pulsePlay 1.6s ease-in-out infinite;
  backdrop-filter: blur(2px);
}
.central-play::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-40%,-50%);
  border-style: solid;
  border-width: 15px 0 15px 25px;
  border-color: transparent transparent transparent #fff;
}
.central-play.hidden {
  animation: none;
  opacity: 0;
  pointer-events: none;
}
@keyframes pulsePlay {
  0%   { transform: translate(-50%,-50%) scale(1); opacity:.85 }
  50%  { transform: translate(-50%,-50%) scale(1.08); opacity:1 }
  100% { transform: translate(-50%,-50%) scale(1); opacity:.85 }
}

/* BOTTOM CONTROLS */
.player-bottom-controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 15px 10px 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  display: flex; align-items: center; gap: 12px;
  z-index: 20;
}
.time-text { font-size: 13px; font-weight: 500; }
.progress-bar {
  flex-grow: 1; height: 3px; background: rgba(255,255,255,0.3);
  position: relative; border-radius: 2px;
}
.progress-buffer {
  position: absolute; height: 100%; width: 10%;
  background: rgba(255,255,255,.5); transition: width 15s linear;
}
.progress-fill {
  position: absolute; left: 0; top: 0; height: 100%; width: 0%;
  background: #ff0000; border-radius: 2px;
}
.progress-dot {
  position: absolute; left: 0%; top: 50%; transform: translate(-50%, -50%);
  width: 10px; height: 10px; background: #ff0000; border-radius: 50%;
}

/* ===== BANNER ===== */
.join-banner {
  background: linear-gradient(90deg, #330033 0%, #000000 100%);
  padding: 12px 15px; display: flex; justify-content: space-between;
  align-items: center; border-bottom: 1px solid #1a1a1a;
}
.join-text { font-size: 15px; font-weight: bold; }
.join-btn {
  background: #ffcc00; color: #000;
  padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 14px;
}

/* ===== STATS ROW ===== */
.stats-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
.views-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.views-num { font-size: 13px; font-weight: bold; }
.likes-pill {
  background: #1a1a1a; border-radius: 20px; padding: 8px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.likes-icons { display: flex; gap: 15px; align-items: center; }
.likes-icons span { font-size: 12px; display: flex; align-items: center; gap: 4px; }
.text-green { color: #4CAF50; }
.text-red { color: #F44336; }
.percent { font-size: 13px; font-weight: bold; margin-top: 2px; }
.action-icons { display: flex; gap: 12px; align-items: center; }

/* ===== DESCRIPTION BOX ===== */
.desc-box {
  margin: 5px 15px 20px; border: 1px solid #333; border-radius: 25px;
  padding: 12px 20px; display: flex; align-items: center; gap: 10px;
  font-size: 15px; color: #ddd;
}

/* ===== BOTTOM NAV ===== */
.bottom-filler {
  background-color: #ffb300; flex-grow: 1; padding: 20px 15px 30px;
  border-top-left-radius: 25px; border-top-right-radius: 25px; display: flex;
}
.bottom-nav {
  background: #111; width: 100%; border-radius: 30px;
  display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 9px; font-weight: bold; color: #aaa; }
.nav-center {
  background: #fff; border-radius: 50%; width: 40px; height: 40px;
  display: flex; justify-content: center; align-items: center; margin-top: -10px;
}
</style>
